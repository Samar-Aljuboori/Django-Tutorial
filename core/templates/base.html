<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task Tracker{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .app-card {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #1a1a1a;
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Input & Form Styling */
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #2563eb;
        }

        .btn-add {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-add:hover {
            background-color: #1d4ed8;
        }

        /* Search Box Styling */
        .search-box {
            margin-bottom: 20px;
        }

        /* Task List Styling */
        .task-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9fafb;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #edf2f7;
        }

        .task-title {
            font-size: 15px;
            color: #374151;
        }

        .completed {
            text-decoration: line-through;
            color: #9ca3af;
        }

        /* Action Buttons */
        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            transition: opacity 0.2s;
        }

        .btn-done {
            background-color: #10b981;
            color: white;
        }

        .btn-undo {
            background-color: #6b7280;
            color: white;
        }

        .btn-delete {
            background-color: #ef4444;
            color: white;
        }

        .btn-action:hover {
            opacity: 0.85;
        }

        .empty-state {
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <div class="app-card">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
