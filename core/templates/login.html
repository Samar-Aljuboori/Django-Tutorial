<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Task Manager</title>
</head>
<body>
    <h2>Login to Your Account</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}    <!--  .as_p     as paragraph-->
        <button type="submit">Login</button>
        <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
    </form>
</body>
</html>
