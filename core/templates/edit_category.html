{% extends 'base.html' %}

{% block title %}Edit Category - Task Tracker{% endblock %}

{% block content %}
<header class="top-header">
    <h1>Edit Category</h1>
    <p class="subtitle">Update the name of your task category below.</p>
</header>

<section class="panel-card" style="max-width: 550px;">
    <form method="POST">
        {% csrf_token %}

        <div style="margin-bottom: 16px;">
            <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px;">Category Name</label>
            <input type="text" name="category_name" value="{{ category.name }}" required class="form-input" style="width: 100%;">
        </div>

        <div style="display: flex; gap: 12px; align-items: center; margin-top: 20px;">
            <button type="submit" class="btn-primary">Save Changes</button>
            <a href="{% url 'categories' %}" class="btn-action-sm btn-edit" style="padding: 9px 18px; font-size: 14px; text-decoration: none;">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
