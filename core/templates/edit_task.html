{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Task{% endblock %}

{% block content %}
    <h1>Edit Task</h1>

    <!-- Form to edit existing task details -->
    <form method="POST" class="add-task-form">
        {% csrf_token %}

        <!-- Task title input -->
        <div class="form-row">
            <input type="text" name="title" value="{{ task.title }}" required class="task-input">
        </div>

        <!-- Priority dropdown and due date picker pre-filled -->
        <div class="form-row">
            <select name="priority" class="priority-select">
                <option value="low" {% if task.priority == 'low' %}selected{% endif %}>Low Priority</option>
                <option value="high" {% if task.priority == 'high' %}selected{% endif %}>High Priority</option>
            </select>

            <input type="date" name="due_date" value="{{ task.due_date|date:'Y-m-d' }}" class="date-input">
        </div>

        <!-- Save and Cancel action buttons -->
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button type="submit" class="btn-add">Save Changes</button>
            <a href="{% url 'core' %}" class="btn-action btn-undo">Cancel</a>
        </div>
    </form>
{% endblock %}
